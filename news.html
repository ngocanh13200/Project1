<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03100B">
<title>METEO·RADAR — Tin tức hôm nay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03100B;
    --bg2: #061A12;
    --panel: rgba(76,224,90,.045);
    --panel-edge: rgba(76,224,90,.18);
    --grid: rgba(76,224,90,.075);
    --phosphor: #4CE05A;
    --phosphor-soft: #7FE98A;
    --amber: #FFC24B;
    --cyan: #3FD6FF;
    --danger: #FF6B6B;
    --text: #C9F5C0;
    --muted: #6FA86B;
    --dim: #4E7F52;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "IBM Plex Mono", monospace;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(63,214,255,.06), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(255,194,75,.05), transparent 55%),
      var(--bg);
    min-height: 100vh;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; }

  /* ---------- Topbar ---------- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    padding: 16px clamp(16px, 4vw, 44px);
    border-bottom: 1px solid var(--panel-edge);
    background: rgba(3,16,11,.7);
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .brand {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: .06em;
    color: var(--phosphor);
    text-shadow: 0 0 14px rgba(76,224,90,.45);
    white-space: nowrap;
  }
  .brand .slash { color: var(--amber); }

  .nav { display: flex; gap: 4px; }
  .nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 15px;
    border-radius: 999px;
    transition: all .18s ease;
  }
  .nav a:hover { color: var(--text); background: rgba(76,224,90,.07); }
  .nav a.active { color: var(--phosphor); background: rgba(76,224,90,.12); }
  .nav a:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }

  .date-chip {
    font-size: 12px;
    color: var(--amber);
    border: 1px solid rgba(255,194,75,.3);
    border-radius: 999px;
    padding: 8px 14px;
    white-space: nowrap;
  }

  .clock {
    display: flex;
    align-items: baseline;
    gap: 8px;
    background: none;
    border: 1px solid rgba(255,194,75,.3);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    transition: all .18s ease;
    white-space: nowrap;
  }
  .clock:hover { border-color: var(--phosphor); background: rgba(76,224,90,.07); }
  .clock:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }
  .clock .clk-date { font-size: 12px; color: var(--amber); }
  .clock .clk-time { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: .04em; }
  .clock .clk-time::after {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: transparent;
    margin-left: 7px;
    vertical-align: 2px;
  }
  .clock.sim .clk-time::after { background: var(--amber); box-shadow: 0 0 8px rgba(255,194,75,.8); }
  .clock.sim .clk-date { text-decoration: underline dotted rgba(255,194,75,.6); }

  /* ---------- Ticker ---------- */

  .ticker {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--panel-edge);
    background: rgba(226,87,87,.06);
    overflow: hidden;
  }
  .ticker .label {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--danger);
    background: rgba(255,107,107,.1);
    padding: 10px 16px;
    border-right: 1px solid rgba(255,107,107,.25);
  }
  .ticker .label .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--danger);
    animation: blink 1.4s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }
  .ticker .track {
    flex: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .ticker .items {
    display: inline-flex;
    gap: 0;
    white-space: nowrap;
    padding-left: 100%;
    animation: marquee 40s linear infinite;
  }
  .ticker .items span {
    font-size: 12.5px;
    color: var(--text);
    padding: 0 28px;
  }
  .ticker .items span::before { content: "◆ "; color: var(--amber); font-size: 9px; }
  @keyframes marquee {
    to { transform: translateX(-100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker .items { animation: none; padding-left: 0; flex-wrap: wrap; white-space: normal; }
    .ticker .items span { padding: 6px 14px; }
    .ticker .label .dot { animation: none; }
  }

  /* ---------- Main ---------- */

  main {
    max-width: 1060px;
    margin: 0 auto;
    padding: clamp(24px, 4vw, 44px) clamp(16px, 4vw, 44px) 50px;
  }

  .sec-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 34px 0 16px;
  }
  .sec-head .t {
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--phosphor);
  }
  .sec-head::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--panel-edge);
  }
  .sec-head .meta { font-size: 11px; color: var(--dim); }

  .banner {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--amber);
    background: rgba(255,194,75,.08);
    border: 1px solid rgba(255,194,75,.3);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
  }
  .banner.show { display: flex; }

  .loading {
    font-size: 13px;
    color: var(--phosphor);
    letter-spacing: .2em;
    text-transform: uppercase;
    margin: 40px 0;
    animation: blink 1.2s steps(2) infinite;
  }

  /* ---------- Featured ---------- */

  .featured {
    display: grid;
    grid-template-columns: 290px 1fr;
    gap: 24px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 20px;
    align-items: center;
  }
  .featured img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--panel-edge);
    display: block;
    background: var(--bg2);
  }
  .featured .chip {
    display: inline-block;
    font-size: 10.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--amber);
    border: 1px solid rgba(255,194,75,.35);
    border-radius: 999px;
    padding: 5px 12px;
    margin-bottom: 12px;
  }
  .featured h2 {
    font-family: "Space Grotesk", sans-serif;
    font-size: clamp(20px, 3vw, 27px);
    font-weight: 700;
    letter-spacing: -.01em;
    line-height: 1.25;
    margin-bottom: 10px;
  }
  .featured p.ex {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .featured a.read {
    display: inline-block;
    color: var(--phosphor);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid rgba(76,224,90,.35);
    border-radius: 999px;
    padding: 9px 18px;
    transition: all .18s ease;
  }
  .featured a.read:hover { background: rgba(76,224,90,.1); }

  /* ---------- News grid ---------- */

  .news-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
  }
  .news-card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color .18s ease, transform .18s ease;
  }
  .news-card:hover { border-color: rgba(76,224,90,.4); transform: translateY(-2px); }
  .news-card .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .news-card .cat {
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  .news-card .time { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .news-card h3 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
  }
  .news-card h3 a { color: var(--text); text-decoration: none; }
  .news-card h3 a:hover { color: var(--phosphor); }
  .news-card p {
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--muted);
    flex: 1;
  }
  .news-card .src { font-size: 11px; color: var(--dim); }

  /* ---------- Image of the day ---------- */

  .img-day {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 20px;
  }
  .img-day img {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--panel-edge);
    display: block;
    background: var(--bg2);
  }
  .img-day .cap {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 12px;
    line-height: 1.6;
  }
  .img-day .cap b { color: var(--text); }

  /* ---------- Clock modal ---------- */

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(3,16,11,.8);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 40;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    width: 100%;
    max-width: 400px;
    background: var(--bg2);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 26px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.7);
  }
  .modal h2 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.01em;
    margin-bottom: 6px;
    color: var(--text);
  }
  .modal .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
  .modal .sub .sim-note { color: var(--amber); }

  .modal label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .14em;
    margin-bottom: 8px;
  }
  .modal input[type="datetime-local"] {
    width: 100%;
    background: rgba(76,224,90,.05);
    border: 1px solid var(--panel-edge);
    border-radius: 11px;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    padding: 12px 14px;
    color-scheme: dark;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .modal input[type="datetime-local"]:focus {
    outline: none;
    border-color: var(--phosphor);
    box-shadow: 0 0 0 3px rgba(76,224,90,.15);
  }

  .presets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
  }
  .presets button {
    background: rgba(76,224,90,.06);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    color: var(--muted);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .presets button:hover { border-color: var(--phosphor); color: var(--phosphor); }
  .presets button:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn-primary {
    flex: 1;
    background: var(--phosphor);
    color: #06231F;
    border: none;
    border-radius: 11px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 12px;
    cursor: pointer;
    transition: background .18s ease;
  }
  .btn-primary:hover { background: var(--phosphor-soft); }
  .btn-primary:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .btn-ghost {
    flex: 1;
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--muted);
    border-radius: 11px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px;
    cursor: pointer;
    transition: all .18s ease;
  }
  .btn-ghost:hover { border-color: var(--amber); color: var(--amber); }
  .btn-ghost:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }

  /* ---------- Footer ---------- */

  footer {
    border-top: 1px solid var(--panel-edge);
    padding: 18px clamp(16px, 4vw, 44px);
    font-size: 11.5px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--phosphor); }

  /* ---------- Motion ---------- */

  @media (prefers-reduced-motion: no-preference) {
    .featured, .news-grid, .img-day { animation: rise .55s cubic-bezier(.2,.7,.3,1) .1s both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }

  /* ---------- Responsive ---------- */

  @media (max-width: 680px) {
    .featured { grid-template-columns: 1fr; }
    .ticker .label { padding: 10px 12px; }
    .date-chip { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">METEO<span class="slash">·</span>RADAR</div>
    <nav class="nav">
      <a href="weather.html">Thời tiết</a>
      <a href="news.html" class="active">Tin tức</a>
    </nav>
    <button class="clock" id="clockBtn" type="button" aria-label="Chỉnh ngày giờ" title="Chỉnh ngày giờ hiển thị">
      <span class="clk-date" id="clkDate">—</span>
      <span class="clk-time" id="clkTime">--:--:--</span>
    </button>
  </header>

  <div class="ticker" id="tickerWrap" style="display:none;">
    <div class="label"><span class="dot"></span>Tin nóng</div>
    <div class="track"><div class="items" id="tickerItems"></div></div>
  </div>

  <main>
    <div class="banner" id="banner"></div>
    <div class="loading" id="loading">Đang thu thập tin tức...</div>

    <section id="featuredSec" style="display:none;">
      <div class="sec-head" style="margin-top:0;"><span class="t">Tiêu điểm hôm nay</span></div>
      <article class="featured" id="featured"></article>
    </section>

    <section id="newsSec" style="display:none;">
      <div class="sec-head"><span class="t">Tin tức trong ngày</span><span class="meta" id="newsMeta">—</span></div>
      <div class="news-grid" id="newsGrid"></div>
    </section>

    <section id="imgSec" style="display:none;">
      <div class="sec-head"><span class="t">Hình ảnh trong ngày</span></div>
      <div class="img-day" id="imgDay"></div>
    </section>
  </main>

  <footer>
    <span>Nguồn tin: <a href="https://vi.wikipedia.org" target="_blank" rel="noopener">Wikipedia tiếng Việt</a> · Sự kiện trong ngày</span>
    <span id="updated">—</span>
  </footer>

  <!-- Clock modal -->
  <div class="modal-backdrop" id="clockModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="clockTitle">
      <h2 id="clockTitle">Chỉnh ngày giờ</h2>
      <p class="sub" id="clockSub">Đặt ngày giờ hiển thị trên trang. <span class="sim-note" id="simNote" style="display:none;">Đang giả lập — bấm "Giờ thật" để quay lại.</span></p>
      <label for="clockInput">Ngày &amp; giờ</label>
      <input type="datetime-local" id="clockInput">
      <div class="presets">
        <button type="button" data-preset="now">Hiện tại</button>
        <button type="button" data-preset="plus1h">+1 giờ</button>
        <button type="button" data-preset="plus1d">+1 ngày</button>
        <button type="button" data-preset="tomorrow9">Ngày mai 09:00</button>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="clockReset">Giờ thật</button>
        <button type="button" class="btn-primary" id="clockApply">Áp dụng</button>
      </div>
    </div>
  </div>

</div>

<script src="clock.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var loading = $("loading"), banner = $("banner");

  var DAYS = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
  var MONTHS = ["tháng 1","tháng 2","tháng 3","tháng 4","tháng 5","tháng 6","tháng 7","tháng 8","tháng 9","tháng 10","tháng 11","tháng 12"];

  function pad2(n) { return String(n).padStart(2, "0"); }

  var clockBtn = $("clockBtn"), clockModal = $("clockModal"), clockInput = $("clockInput");

  function fmtDate(d) {
    return DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }
  function fmtTime(d) {
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }
  function toLocalInput(d) {
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
      "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function refreshClock() {
    var d = SkyClock.now();
    $("clkDate").textContent = fmtDate(d);
    $("clkTime").textContent = fmtTime(d);
    clockBtn.classList.toggle("sim", SkyClock.isSim());
    $("simNote").style.display = SkyClock.isSim() ? "inline" : "none";
  }
  function refreshUpdated() {
    var upd = SkyClock.now();
    $("updated").textContent = "Cập nhật " + pad2(upd.getHours()) + ":" + pad2(upd.getMinutes()) +
      (SkyClock.isSim() ? " · giờ giả lập" : "");
  }
  refreshClock();
  setInterval(refreshClock, 1000);

  function showBanner(msg) {
    banner.textContent = msg;
    banner.classList.add("show");
  }

  function api(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  /* ---------- Parse Wikipedia feed ---------- */

  function stripHtml(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    doc.querySelectorAll("style, script").forEach(function (n) { n.remove(); });
    return doc.body.textContent.replace(/\s+/g, " ").trim();
  }

  function firstLink(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    var a = doc.querySelector("a[href]");
    if (!a) return null;
    var href = a.getAttribute("href");
    if (href.indexOf("./") === 0) return "https://vi.wikipedia.org/wiki/" + href.slice(2);
    if (href.indexOf("/wiki/") === 0) return "https://vi.wikipedia.org" + href;
    return null;
  }

  function newsDate(html) {
    var m = html.match(/<!--\s*(\d{1,2})\s+(?:tháng\s+)?(\d{1,2})\s*-->/i);
    if (!m) return "";
    return m[1] + "/" + m[2];
  }

  function renderFeed(d) {
    var items = [];

    (d.news || []).forEach(function (n) {
      var story = stripHtml(n.story || "");
      var link = firstLink(n.story || "");
      var date = newsDate(n.story || "");
      if (story) {
        items.push({
          cat: "Tin tức",
          title: story.length > 110 ? story.slice(0, 110).replace(/\s+\S*$/, "") + "…" : story,
          excerpt: "",
          link: link || "https://vi.wikipedia.org/wiki/Wikipedia:Bản_tin",
          time: date,
          src: "Wikipedia"
        });
      }
    });

    var tfa = d.tfa;
    var featured = null;
    if (tfa) {
      featured = {
        title: tfa.titles && (tfa.titles.normalized || tfa.titles.display),
        extract: stripHtml(tfa.extract || "").slice(0, 320),
        image: tfa.thumbnail && tfa.thumbnail.source,
        link: tfa.content_urls && tfa.content_urls.desktop && tfa.content_urls.desktop.page
      };
    }

    var img = d.image;
    var imgDay = null;
    if (img) {
      imgDay = {
        src: img.thumbnail && img.thumbnail.source,
        title: img.title,
        desc: img.description && img.description.text
      };
    }

    render(items, featured, imgDay);
  }

  /* ---------- Render ---------- */

  function render(items, featured, imgDay) {
    var tickerItems = $("tickerItems");
    tickerItems.innerHTML = "";
    items.forEach(function (it) {
      var s = document.createElement("span");
      s.textContent = it.title;
      tickerItems.appendChild(s);
    });
    if (items.length > 0) $("tickerWrap").style.display = "flex";

    if (featured) {
      var f = $("featured");
      f.innerHTML =
        (featured.image ? '<img src="' + esc(featured.image) + '" alt="" loading="lazy">' : '<div style="aspect-ratio:4/3;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim);">KHÔNG CÓ ẢNH</div>') +
        '<div>' +
          '<span class="chip">Bài viết tiêu điểm</span>' +
          '<h2>' + esc(featured.title) + '</h2>' +
          '<p class="ex">' + esc(featured.extract) + '</p>' +
          '<a class="read" href="' + esc(featured.link || "#") + '" target="_blank" rel="noopener">Đọc tiếp →</a>' +
        '</div>';
      $("featuredSec").style.display = "block";
    }

    var grid = $("newsGrid");
    grid.innerHTML = "";
    items.forEach(function (it) {
      var card = document.createElement("article");
      card.className = "news-card";
      card.innerHTML =
        '<div class="top"><span class="cat">' + esc(it.cat) + '</span><span class="time">' + esc(it.time) + '</span></div>' +
        '<h3><a href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></h3>' +
        '<p>' + esc(it.excerpt || "Sự kiện nổi bật được tổng hợp từ Wikipedia tiếng Việt.") + '</p>' +
        '<span class="src">Nguồn: ' + esc(it.src) + '</span>';
      grid.appendChild(card);
    });
    $("newsMeta").textContent = items.length + " tin";
    $("newsSec").style.display = "block";

    if (imgDay) {
      var im = $("imgDay");
      im.innerHTML =
        '<img src="' + esc(imgDay.src) + '" alt="" loading="lazy">' +
        '<p class="cap"><b>' + esc(imgDay.title) + '</b>' +
        (imgDay.desc ? " — " + esc(imgDay.desc) : "") + '</p>';
      $("imgSec").style.display = "block";
    }

    var upd = SkyClock.now();
    $("updated").textContent = "Cập nhật " + pad2(upd.getHours()) + ":" + pad2(upd.getMinutes()) +
      (SkyClock.isSim() ? " · giờ giả lập" : "");
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : s;
    return d.innerHTML;
  }

  /* ---------- Mock fallback ---------- */

  var MOCK_ITEMS = [
    { cat: "Thời sự", title: "Quốc hội thông qua nhiều luật quan trọng trong kỳ họp thứ 10", excerpt: "Các dự luật về đất đai, kinh doanh bất động sản và nhà ở được thông qua với tỷ lệ tán thành cao.", time: "08:30", src: "Tổng hợp" },
    { cat: "Kinh tế", title: "Chỉ số CPI tháng 9 tăng nhẹ, lạm phát được kiểm soát dưới mục tiêu", excerpt: "Giá lương thực, thực phẩm và dịch vụ giáo dục là những nhóm tác động chính đến chỉ số giá tiêu dùng.", time: "07:45", src: "Tổng hợp" },
    { cat: "Thế giới", title: "Hội nghị thượng đỉnh về khí hậu kêu gọi tăng tốc chuyển đổi năng lượng sạch", excerpt: "Các nhà lãnh đạo cam kết đẩy nhanh lộ trình giảm phát thải và hỗ trợ tài chính cho các nước đang phát triển.", time: "06:20", src: "Tổng hợp" },
    { cat: "Công nghệ", title: "Trí tuệ nhân tạo tạo sinh bước vào giai đoạn ứng dụng rộng rãi", excerpt: "Nhiều doanh nghiệp trong nước bắt đầu tích hợp AI vào vận hành, từ chăm sóc khách hàng đến phân tích dữ liệu.", time: "05:10", src: "Tổng hợp" },
    { cat: "Thể thao", title: "Đội tuyển quốc gia tập trung chuẩn bị cho giải đấu khu vực", excerpt: "Ban huấn luyện triệu tập 28 cầu thủ, trong đó có nhiều gương mặt trẻ lần đầu được góp mặt.", time: "04:55", src: "Tổng hợp" },
    { cat: "Giải trí", title: "Liên hoan phim quốc tế khai mạc với chủ đề điện ảnh xanh", excerpt: "Sự kiện quy tụ hơn 200 tác phẩm từ 40 quốc gia, diễn ra trong 10 ngày tại TP.HCM.", time: "03:40", src: "Tổng hợp" },
    { cat: "Giáo dục", title: "Nhiều trường đại học công bố phương án tuyển sinh năm tới", excerpt: "Điểm mới đáng chú ý là việc tăng tỷ trọng xét tuyển bằng kết quả học tập bậc phổ thông.", time: "02:15", src: "Tổng hợp" },
    { cat: "Sức khỏe", title: "Khuyến cáo tiêm vaccine phòng bệnh mùa mưa cho trẻ em", excerpt: "Các chuyên gia lưu ý cha mẹ theo dõi lịch tiêm chủng và giữ vệ sinh môi trường sống.", time: "01:05", src: "Tổng hợp" }
  ];

  var MOCK_FEATURED = {
    title: "Ngày hôm nay trên Wikipedia tiếng Việt",
    extract: "Wikipedia là bách khoa toàn thư mở lớn nhất thế giới với hơn 1,2 triệu bài viết tiếng Việt. Mỗi ngày, hàng nghìn tình nguyện viên cập nhật kiến thức về mọi lĩnh vực — từ khoa học, lịch sử đến văn hóa và công nghệ.",
    link: "https://vi.wikipedia.org",
    image: null
  };

  /* ---------- Load ---------- */

  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1).padStart(2, "0");
  var dd = String(now.getDate()).padStart(2, "0");

  api("https://vi.wikipedia.org/api/rest_v1/feed/featured/" + y + "/" + m + "/" + dd)
    .then(function (d) {
      loading.style.display = "none";
      renderFeed(d);
    })
    .catch(function () {
      loading.style.display = "none";
      showBanner("Không kết nối được nguồn tin. Hiển thị tin tức mẫu.");
      render(MOCK_ITEMS, MOCK_FEATURED, null);
    });

  /* ---------- Clock widget ---------- */

  clockBtn.addEventListener("click", function () {
    clockInput.value = toLocalInput(SkyClock.now());
    clockModal.classList.add("open");
    clockInput.focus();
  });

  clockModal.addEventListener("click", function (e) {
    if (e.target === clockModal) clockModal.classList.remove("open");
  });

  document.querySelectorAll(".presets button").forEach(function (b) {
    b.addEventListener("click", function () {
      var base = SkyClock.now();
      var d = new Date(base);
      var p = b.getAttribute("data-preset");
      if (p === "now") d = new Date();
      else if (p === "plus1h") d = new Date(base.getTime() + 3600000);
      else if (p === "plus1d") d = new Date(base.getTime() + 86400000);
      else if (p === "tomorrow9") {
        d = new Date(base.getTime() + 86400000);
        d.setHours(9, 0, 0, 0);
      }
      clockInput.value = toLocalInput(d);
    });
  });

  $("clockApply").addEventListener("click", function () {
    var v = clockInput.value;
    if (!v) return;
    var d = new Date(v);
    if (isNaN(d.getTime())) return;
    SkyClock.setSim(d);
    clockModal.classList.remove("open");
    refreshClock();
    refreshUpdated();
  });

  $("clockReset").addEventListener("click", function () {
    SkyClock.clearSim();
    clockModal.classList.remove("open");
    refreshClock();
    refreshUpdated();
  });
})();
</script>
</body>
</html>
